<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/carga_cadastrar.js" defer></script>
    <title>Cadastrar Carga - Logistica Express</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Carga</h1>
        <form>
            <label for="descricao">Descrição</label><br>
            <input type="text" id="descricao" required><br><br>
            <label for="peso">Peso (kg)</label><br>
            <input type="number" id="peso" min="0.01" step="0.01" required><br><br>
            <label for="volume">Volume (m³)</label><br>
            <input type="number" id="volume" min="0.01" step="0.01" required><br><br>
            <label for="codigoRastreio">Código numérico de rastreio</label><br>
            <input type="text" id="codigoRastreio" required><br><br>
            <label for="idMotorista">Código do Motorista</label><br>
            <input type="number" id="idMotorista" min="1" step="1" required><br><br><button id="btn_cadastrar">Cadastrar Carga</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>

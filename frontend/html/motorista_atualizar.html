<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/motorista_atualizar.js" defer></script>
    <title>Atualizar Motorista - Logistica Express</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Motorista</h1>
        <form>
            <label for="id">Código</label><br>
            <input type="number" id="id" min="1" step="1" required><br><br><label for="nome">Nome</label><br>
            <input type="text" id="nome"><br><br>
            <label for="cnh">CNH</label><br>
            <input type="text" id="cnh"><br><br>
            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf"><br><br>
            <label for="telefone">Telefone</label><br>
            <input type="text" id="telefone"><br><br><button id="btn_atualizar">Atualizar Motorista</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>

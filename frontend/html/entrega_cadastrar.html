<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/entrega_cadastrar.js" defer></script>
    <title>Cadastrar Entrega - Logistica Express</title>
</head>
<body>
    <header>
        <nav><a href="../index.html">Home</a></nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Entrega</h1>
        <form>
            <label for="cidadeDestino">Cidade Destino</label><br>
            <input type="text" id="cidadeDestino" required><br><br>
            <label for="status">Status</label><br>
            <select id="status" required><option value="TRANSITO">TRANSITO</option><option value="ENTREGUE">ENTREGUE</option></select><br><br>
            <label for="data">Data</label><br>
            <input type="date" id="data" required><br><br>
            <label for="hora">Horário</label><br>
            <input type="time" id="hora" required><br><br>
            <label for="idCarga">Código da Carga</label><br>
            <input type="number" id="idCarga" min="1" step="1" required><br><br><button id="btn_cadastrar">Cadastrar Entrega</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
